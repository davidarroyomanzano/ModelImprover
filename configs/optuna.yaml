enabled: true
study_name: audio_tuning
storage: sqlite:///models/optuna.db
direction: maximize
metric: val_accuracy
n_trials: 100
n_workers: 1               # >1 => procesos (spawn), cada uno fijado a GPU i % n_gpus
timeout: null
trial_epochs: 100
trial_patience: 5
n_startup_trials: 5
n_warmup_steps: 5
seed: 42
tune_dsp: true             # false => DSP fijo (sección dsp / plantilla) y Optuna solo busca la red
# joint     => DSP y red en el mismo estudio (cada trial recalcula las features).
# two_phase => 1) busca el DSP con una red fija pequeña; 2) con el mejor DSP (features calculadas
#              una sola vez) busca la red. Más rápido con audios largos o muchos ficheros.
strategy: joint
phase1_trials: null        # trials de la fase del DSP; null => n_trials
phase2_trials: null        # trials de la fase de la red; null => n_trials
phase1_epochs: 15          # épocas por trial en la fase del DSP
phase1_model_params: {}    # sobrescribe la red mínima de la fase del DSP (ver PHASE1_MODEL_PARAMS)

search_space:
  learning_rate: {type: float, low: 0.0001, high: 0.01, log: true}
  batch_size: {type: categorical, choices: [16, 32, 64]}
  n_conv_layers: {type: int, low: 1, high: 3}
  filters: {type: categorical, choices: [16, 32, 64]}
  kernel_size: {type: categorical, choices: [3, 5]}
  n_dense_layers: {type: int, low: 1, high: 2}
  units: {type: categorical, choices: [32, 64, 128]}
  dropout: {type: float, low: 0.0, high: 0.5}

# Búsqueda de enventanado y bloques MFE (se recalculan las features en cada trial).
# Vacío ({}) => solo se optimiza la red. Los parámetros de bloque se nombran <campo>_<i>.
dsp_search_space:
  window_size: {type: float, low: 0.1, high: 1.0, step: 0.05}
  window_step: {type: float, low: 0.1, high: 1.0, step: 0.05}   # se limita a window_size
  mfe_blocks:
    - frame_length: {type: float, low: 0.005, high: 0.1, step: 0.005}
      frame_stride: {type: float, low: 0.005, high: 0.05, step: 0.005}
      n_filters: {type: categorical, choices: [8, 16, 32, 64]}
      fft_length: {type: categorical, choices: [128, 256, 512, 1024, 2048]}
      low_freq: {type: int, low: 1500, high: 5000, step: 100}
      high_freq: {type: int, low: 3000, high: 8000, step: 100}
      noise_floor_db: {type: int, low: -60, high: -20, step: 2}
    - frame_length: {type: float, low: 0.005, high: 0.1, step: 0.005}
      frame_stride: {type: float, low: 0.005, high: 0.05, step: 0.005}
      n_filters: {type: categorical, choices: [8, 16, 32, 64]}
      fft_length: {type: categorical, choices: [128, 256, 512, 1024, 2048]}
      low_freq: {type: int, low: 50, high: 1500, step: 50}
      high_freq: {type: int, low: 400, high: 4000, step: 100}
      noise_floor_db: {type: int, low: -60, high: -20, step: 2}
