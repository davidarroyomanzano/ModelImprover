paths:                     # relativas a projects/<producto>/<turbina>/<versión de datos>/
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  test_dir: data/test
  models_dir: models
  projects_dir: projects   # raíz de proyectos (DS_PROJECTS_DIR)

data:
  product: test            # producto por defecto (--product / DS_PRODUCT): pinbolt, bathear, bladehiss...
  turbine: all             # turbina o ámbito (--turbine / DS_TURBINE): g5x, n155, all...
  version: v1              # versión de los datos (--data-version / DS_DATA_VERSION)
  source: local            # local | s3 | onedrive (descarga a raw_dir antes de procesar)
  remote_prefix: raw
  extensions: [".wav", ".flac", ".ogg"]
  test_size: 0.15
  val_size: 0.15
  segment_overlap: 0.0     # 0.0 - 0.9
  min_segment_ratio: 0.5   # descarta segmentos finales más cortos que este ratio
  seed: 42

train:
  epochs: 100
  patience: 10
  use_class_weights: true
  scaler: standard         # standard | minmax
  deterministic: true      # ops deterministas de TensorFlow: reproducible, algo más lento
  model_params:
    learning_rate: 0.001
    batch_size: 32
    n_conv_layers: 2
    filters: 32
    kernel_size: 3
    n_dense_layers: 1
    units: 64
    dropout: 0.3

export:
  quantization: float16    # float32 | float16 | dynamic | int8
  representative_samples: 200
  export_header: true

storage:
  backend: none            # none | local | s3 | onedrive
  local_root: ""
  s3_bucket: ""
  s3_prefix: ""
  onedrive_root: ""
  upload_artifacts: false
